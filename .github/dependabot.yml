version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: / # the folder holding pyproject.toml and uv.lock
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
