# Tool settings to merge into a project's pyproject.toml. Adjust paths to the project layout.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# extend-exclude = ["src/<package>/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S603 flags every subprocess call, even with an argument list; S602 (shell=True) stays on.
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts, and fixture values with names like `password` or `token`.
"{tests/**,**/test_*.py}" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
